# ================================================================
# docker-compose.yml — Sentinelle Numérique · Module G8
# ----------------------------------------------------------------
# CE FICHIER lance TOUS les services d'un coup avec :
#   docker compose up --build
#
# ARCHITECTURE :
#   ganache          → blockchain Ethereum locale (port 7545)
#   hash-service     → calcule le SHA-256 des fichiers (port 8082)
#   ledger-service   → inscrit les hashs dans la blockchain (port 8081)
#   verify-service   → vérifie l'intégrité d'un média (port 8083 à confirmer)
#   audit-service    → logs et historique des certifications (port 8084 à confirmer)
#   dashboard        → interface web visible (port 80)
#
# ORDRE DE DÉMARRAGE (depends_on) :
#   ganache démarre en premier (la blockchain doit exister avant les services)
#   ledger-service attend ganache
#   les autres services attendent ledger-service
#   dashboard démarre en dernier
# ================================================================

version: '3.8'

services:

  # ==============================================================
  # GANACHE — Blockchain Ethereum locale
  # --------------------------------------------------------------
  # C'est le "registre distribué" du dossier de conception.
  # Ganache simule une vraie blockchain Ethereum en local,
  # sans frais de Gas réels — parfait pour le développement.
  # Port 7545 : port RPC standard de Ganache (défini dans .env.example)
  # ==============================================================
  ganache:
    image: trufflesuite/ganache:latest   # image officielle Ganache
    container_name: ganache
    ports:
      - "7545:7545"                      # port RPC accessible depuis les autres services
    command: >
      --port 7545
      --networkId 5777
      --accounts 10
      --deterministic
      --mnemonic "sentinelle numerique groupe huit blockchain integrite sup ptic"
    # --deterministic : génère toujours les mêmes comptes (adresses prévisibles)
    # --mnemonic      : phrase secrète fixe → adresses identiques à chaque redémarrage
    networks:
      - sentinelle-network
    healthcheck:
      # Vérifie que Ganache répond avant de démarrer les autres services
      test: ["CMD", "curl", "-f", "http://localhost:7545"]
      interval: 5s
      timeout: 3s
      retries: 5


  # ==============================================================
  # HASH-SERVICE — Calcul SHA-256
  # --------------------------------------------------------------
  # Composant "Hasher" du dossier de conception.
  # Reçoit un fichier, retourne son empreinte SHA-256.
  # Port 8082 (lu dans le Dockerfile)
  # ==============================================================
  hash-service:
    build:
      context: ./services/hash-service   # dossier contenant le Dockerfile
      dockerfile: Dockerfile
    container_name: hash-service
    ports:
      - "8081:8081"
    networks:
      - sentinelle-network
    restart: unless-stopped              # redémarre automatiquement si crash
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 10s
      timeout: 5s
      retries: 3


  # ==============================================================
  # LEDGER-SERVICE — Connexion à la Blockchain
  # --------------------------------------------------------------
  # Composant "BlockchainConnector" du dossier de conception.
  # Inscrit les hashs dans le Smart Contract sur Ganache.
  # Port 8081 (lu dans le Dockerfile)
  # Dépend de ganache : la blockchain doit être prête avant lui
  # ==============================================================
  ledger-service:
    build:
      context: ./services/ledger-service
      dockerfile: Dockerfile
    container_name: ledger-service
    ports:
      - "8082:8082"
    environment:
      # Ces variables viennent du .env.example du ledger-service
      # IMPORTANT : dans Docker, on remplace 127.0.0.1 par le nom du service "ganache"
      # Car dans Docker, les services se parlent par leur NOM, pas par localhost
      - BLOCKCHAIN_RPC_URL=http://ganache:7545
      - CONTRACT_ADDRESS=${CONTRACT_ADDRESS:-}   # à remplir après déploiement du contrat
      - PRIVATE_KEY=${PRIVATE_KEY:-}             # clé privée du compte Ganache
    depends_on:
      ganache:
        condition: service_healthy               # attend que Ganache soit prêt
    networks:
      - sentinelle-network
    restart: unless-stopped


  # ==============================================================
  # VERIFY-SERVICE — Vérification d'intégrité
  # --------------------------------------------------------------
  # Implémente la Séquence 2 du dossier de conception.
  # Recalcule le hash d'un fichier et l'interroge dans la blockchain.
  # ⚠ Port à confirmer — mets le bon port après avoir vu le Dockerfile
  # ==============================================================
  verify-service:
    build:
      context: ./services/verify-service
      dockerfile: Dockerfile
    container_name: verify-service
    ports:
      - "8083:8083"    # ⚠ À MODIFIER si le vrai port dans le Dockerfile est différent
    environment:
      - BLOCKCHAIN_RPC_URL=http://ganache:7545
      - LEDGER_SERVICE_URL=http://ledger-service:8082
    depends_on:
      - ledger-service
      - hash-service
    networks:
      - sentinelle-network
    restart: unless-stopped


  # ==============================================================
  # AUDIT-SERVICE — Logs et historique
  # --------------------------------------------------------------
  # Enregistre l'historique de toutes les certifications.
  # Permet à l'Administrateur de "Consulter historique des certifications"
  # (cas d'utilisation du diagramme UML)
  # ⚠ Port à confirmer — mets le bon port après avoir vu le Dockerfile
  # ==============================================================
  audit-service:
    build:
      context: ./services/audit-service
      dockerfile: Dockerfile
    container_name: audit-service
    ports:
      - "8084:8084"    # ⚠ À MODIFIER si le vrai port dans le Dockerfile est différent
    environment:
      - LEDGER_SERVICE_URL=http://ledger-service:8082
    depends_on:
      - ledger-service
    networks:
      - sentinelle-network
    restart: unless-stopped


  # ==============================================================
  # REDIS — File d'attente pour la résilience
  # --------------------------------------------------------------
  # Composant "File Redis" du dossier de conception.
  # Stocke les transactions échouées (Séquence 3 : gestion d'échec).
  # Si Ganache est hors-ligne, la tâche est mise en file Redis
  # et relancée automatiquement à la reconnexion.
  # ==============================================================
  redis:
    image: redis:7-alpine                # image officielle Redis légère
    container_name: redis
    ports:
      - "6379:6379"                      # port standard Redis
    networks:
      - sentinelle-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5


  # ==============================================================
  # DASHBOARD — Interface Web
  # --------------------------------------------------------------
  # C'est TON travail. Sert les fichiers HTML/CSS/JS statiques.
  # Utilise nginx (serveur web léger) pour servir index.html.
  # Port 80 : port HTTP standard → accessible sur http://localhost
  # ==============================================================
  dashboard:
    build:
      context: ./dashboard               # dossier contenant index.html, style.css, script.js
      dockerfile: Dockerfile   # Dockerfile spécial pour le dashboard (voir ci-dessous)
    container_name: dashboard
    ports:
      - "80:80"                          # http://localhost → ouvre le dashboard
    depends_on:
      - hash-service
      - ledger-service
      - verify-service
      - audit-service
    networks:
      - sentinelle-network
    restart: unless-stopped


# ================================================================
# RÉSEAU INTERNE
# ----------------------------------------------------------------
# Tous les services sont sur le même réseau "sentinelle-network".
# Cela leur permet de se parler par leur NOM de service.
# Ex: http://ganache:7545  au lieu de  http://192.168.x.x:7545
# ================================================================
networks:
  sentinelle-network:
    driver: bridge